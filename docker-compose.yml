services:
  postgres:
    image: postgres:16
    container_name: vitrinebilhar-postgres
    environment:
      POSTGRES_DB: vitrinebilhar
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vitrinebilhar"]
      interval: 5s
      timeout: 5s
      retries: 15

  api:
    build:
      context: .
      dockerfile: src/VitrineBilhar.API/Dockerfile
    container_name: vitrinebilhar-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=vitrinebilhar;Username=postgres;Password=postgres
      MultiTenant__AllowHeaderTenantIdInDevelopment: "true"
    ports:
      - "8080:8080"

volumes:
  postgres_data:
